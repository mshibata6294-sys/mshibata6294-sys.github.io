<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>船の流れシミュレーター</title>
<style>
  :root{
    --bg:#0b1c2c; --panel:#12293d; --panel2:#0e2233;
    --text:#eaf2f8; --sub:#9db4c6; --accent:#ffb020;
    --cyan:#4dd8ff; --pale:#a8c8ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    min-height:100dvh;
  }
  .wrap{
    max-width:640px; margin:0 auto; min-height:100dvh;
    display:flex; flex-direction:column; gap:12px;
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));
  }
  header h1{font-size:20px; margin:0 0 4px; letter-spacing:.02em}
  header .desc{margin:0; font-size:12.5px; color:var(--sub); line-height:1.5}

  .sea{
    position:relative; flex:1 1 auto; min-height:320px;
    border-radius:16px; overflow:hidden;
    background:linear-gradient(180deg,#0d3a5c,#082a46);
    box-shadow:inset 0 0 0 1px rgba(120,180,230,.18);
  }
  .sea canvas{position:absolute; inset:0; width:100%; height:100%; display:block}

  .controls{display:flex; align-items:center; gap:10px}
  .play{
    width:48px; height:48px; border-radius:50%; border:none; flex:0 0 auto;
    background:var(--accent); color:#231600; font-size:19px; cursor:pointer;
  }
  .btn{
    height:48px; padding:0 18px; border-radius:24px; border:1px solid rgba(157,180,198,.4);
    background:var(--panel); color:var(--text); font-size:14px; cursor:pointer;
  }
  .elapsed{margin-left:auto; font-size:14px; color:var(--sub); font-variant-numeric:tabular-nums}
  .elapsed b{color:var(--text); font-size:16px}

  .panel{background:var(--panel); border-radius:14px; padding:14px 16px}
  .panel h2{font-size:13px; color:var(--sub); margin:0 0 10px; font-weight:600; letter-spacing:.06em}
  .resMain{font-size:19px; font-weight:700; line-height:1.45; margin-bottom:10px}
  .resMain .deg{color:var(--accent)}
  .rrow{display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    padding:7px 0; border-top:1px solid rgba(157,180,198,.14); font-size:13.5px}
  .rrow .k{color:var(--sub); flex:0 0 auto}
  .rrow .v{text-align:right; font-weight:600; font-variant-numeric:tabular-nums}
  .rrow.full{flex-direction:column; align-items:flex-start; gap:4px}
  .rrow.full .v{text-align:left}

  .igroup{margin-bottom:16px}
  .igroup:last-child{margin-bottom:2px}
  .ihead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px}
  .ihead label{font-size:14px; font-weight:600}
  .ihead .val{font-size:13.5px; color:var(--accent); font-weight:600; font-variant-numeric:tabular-nums}
  input[type=range]{width:100%; accent-color:var(--accent); height:28px; margin:0}
  .seg{display:flex; gap:8px}
  .seg button{
    flex:1; height:42px; border-radius:10px; border:1px solid rgba(157,180,198,.35);
    background:var(--panel2); color:var(--sub); font-size:14px; cursor:pointer;
  }
  .seg button.on{background:var(--accent); border-color:var(--accent); color:#231600; font-weight:700}
  .note{font-size:12px; color:var(--sub); margin:10px 0 0; line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>船の流れシミュレーター</h1>
    <p class="desc">風と潮流を入力すると、船がどう流れるかを計算します</p>
  </header>

  <div class="sea" id="sea"><canvas id="cv"></canvas></div>

  <div class="controls">
    <button class="play" id="btnPlay" aria-label="再生・停止">▶</button>
    <button class="btn" id="btnReset">リセット</button>
    <div class="elapsed" id="elapsed">経過 <b>0分</b> / 60分</div>
  </div>

  <section class="panel">
    <h2>計算結果</h2>
    <div class="resMain" id="resMain">—</div>
    <div class="rrow"><span class="k" id="distLabel">60分で流される距離</span><span class="v" id="resDist">—</span></div>
    <div class="rrow full"><span class="k">ポイントに合わせるなら</span><span class="v" id="resStart">—</span></div>
    <div class="rrow"><span class="k">内訳</span><span class="v" id="resBreak">—</span></div>
  </section>

  <section class="panel">
    <h2>入力</h2>

    <div class="igroup">
      <div class="ihead"><label for="inWindFrom">風向き（吹いてくる方角）</label><span class="val" id="valWindFrom">—</span></div>
      <input type="range" id="inWindFrom" min="0" max="360" step="1" value="315">
    </div>

    <div class="igroup">
      <div class="ihead"><label for="inWindMs">風速</label><span class="val" id="valWindMs">—</span></div>
      <input type="range" id="inWindMs" min="0" max="20" step="0.5" value="6">
    </div>

    <div class="igroup">
      <div class="ihead"><label for="inCurDeg">潮流の向き（流れる方角）</label><span class="val" id="valCurDeg">—</span></div>
      <input type="range" id="inCurDeg" min="0" max="360" step="1" value="180">
    </div>

    <div class="igroup">
      <div class="ihead"><label for="inCurKt">潮流の速さ</label><span class="val" id="valCurKt">—</span></div>
      <input type="range" id="inCurKt" min="0" max="3" step="0.05" value="0.8">
    </div>

    <div class="igroup">
      <div class="ihead"><label>流す時間</label></div>
      <div class="seg" id="segDur">
        <button data-min="10">10分</button>
        <button data-min="30">30分</button>
        <button data-min="60" class="on">60分</button>
        <button data-min="120">120分</button>
      </div>
    </div>

    <p class="note">風圧流は風速の2%で計算しています</p>
  </section>
</div>

<script>
'use strict';
// ---- 定数・ユーティリティ ----
const DIRS = ['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];
const rad = d => d * Math.PI / 180;
const dirName = deg => DIRS[Math.round(deg / 22.5) % 16];
// 方位（進む方角deg・北=0で時計回り）→ ベクトル {x:東, y:北}
const vecFrom = (spd, degTo) => ({ x: spd * Math.sin(rad(degTo)), y: spd * Math.cos(rad(degTo)) });

// ---- 状態 ----
const state = {
  windFrom: 315,   // 風向き（吹いてくる方角, deg）
  windMs: 6,       // 風速 m/s
  curDeg: 180,     // 潮流の向き（流れる方角, deg）
  curKt: 0.8,      // 潮流の速さ kt
  minutes: 60,     // 流す時間（分）
  playing: false,
  elapsedMin: 0,   // 経過（シミュレーション分）
};
const PLAY_SECONDS = 24;   // 全時間を再生する実秒数
let trail = [];            // 船の軌跡 {e,n} km（開始位置からの東・北オフセット）
const TRAIL_MAX = 40;

// ---- 計算 ----
function compute(){
  const windKt = state.windMs * 1.944;
  const windDriftKt = windKt * 0.02;
  const windDriftDeg = (state.windFrom + 180) % 360;
  const cv = vecFrom(state.curKt, state.curDeg);
  const wv = vecFrom(windDriftKt, windDriftDeg);
  const x = cv.x + wv.x, y = cv.y + wv.y;
  const spd = Math.hypot(x, y);
  const deg = (Math.atan2(x, y) * 180 / Math.PI + 360) % 360;
  const distKm = spd * 1.852 * state.minutes / 60;
  return { windKt, windDriftKt, windDriftDeg, spd, deg, distKm, revDeg: (deg + 180) % 360 };
}

// ---- DOM ----
const $ = id => document.getElementById(id);
const els = {
  windFrom: $('inWindFrom'), windMs: $('inWindMs'), curDeg: $('inCurDeg'), curKt: $('inCurKt'),
  valWindFrom: $('valWindFrom'), valWindMs: $('valWindMs'), valCurDeg: $('valCurDeg'), valCurKt: $('valCurKt'),
  resMain: $('resMain'), distLabel: $('distLabel'), resDist: $('resDist'), resStart: $('resStart'), resBreak: $('resBreak'),
  elapsed: $('elapsed'), btnPlay: $('btnPlay'), segDur: $('segDur'),
};

function updateReadouts(){
  els.valWindFrom.textContent = `${dirName(state.windFrom)}（${state.windFrom}°）から`;
  els.valWindMs.textContent = `${state.windMs} m/s`;
  els.valCurDeg.textContent = `${dirName(state.curDeg)}（${state.curDeg}°）へ`;
  els.valCurKt.textContent = `${state.curKt.toFixed(2)} kt`;
}

function updateResults(){
  const c = compute();
  if (c.spd < 0.005){
    els.resMain.textContent = '船の流れ：ほぼ流れません';
  } else {
    els.resMain.innerHTML = `船の流れ：<span class="deg">${dirName(c.deg)}（${Math.round(c.deg)}°）</span>へ ${c.spd.toFixed(2)} kt`;
  }
  els.distLabel.textContent = `${state.minutes}分で流される距離`;
  els.resDist.textContent = c.spd < 0.005 ? '約 0.00 km' : `約 ${c.distKm.toFixed(2)} km（${dirName(c.deg)}へ）`;
  els.resStart.textContent = c.spd < 0.005
    ? '流れがほぼないため、その場にとどまります'
    : `ポイントから ${dirName(c.revDeg)} へ約 ${c.distKm.toFixed(2)} km の位置から流し始める`;
  els.resBreak.textContent = `潮流 ${state.curKt.toFixed(2)} kt ／ 風圧流 ${c.windDriftKt.toFixed(2)} kt（風速の2%）`;
  updateElapsedLabel();
}

function updateElapsedLabel(){
  const shown = state.elapsedMin >= state.minutes ? state.minutes : Math.floor(state.elapsedMin);
  els.elapsed.innerHTML = `経過 <b>${shown}分</b> / ${state.minutes}分`;
}

// 入力が変わったら再計算してアニメーションを最初から（再生/停止の状態は維持）
function onInputChanged(){
  state.elapsedMin = 0;
  trail = [];
  updateReadouts();
  updateResults();
}

els.windFrom.addEventListener('input', e => { state.windFrom = Number(e.target.value); onInputChanged(); });
els.windMs.addEventListener('input', e => { state.windMs = Number(e.target.value); onInputChanged(); });
els.curDeg.addEventListener('input', e => { state.curDeg = Number(e.target.value); onInputChanged(); });
els.curKt.addEventListener('input', e => { state.curKt = Number(e.target.value); onInputChanged(); });
els.segDur.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.minutes = Number(b.dataset.min);
  [...els.segDur.children].forEach(x => x.classList.toggle('on', x === b));
  onInputChanged();
});

// ---- 再生コントロール ----
function setPlaying(p){
  state.playing = p;
  els.btnPlay.textContent = p ? '⏸' : '▶';
}
els.btnPlay.addEventListener('click', () => {
  if (state.playing){ setPlaying(false); return; }
  if (state.elapsedMin >= state.minutes){ state.elapsedMin = 0; trail = []; }
  setPlaying(true);
});
$('btnReset').addEventListener('click', () => {
  state.elapsedMin = 0;
  trail = [];
  setPlaying(false);
  updateElapsedLabel();
});

// ---- キャンバス ----
const sea = $('sea'), cv = $('cv'), ctx = cv.getContext('2d');
let cssW = 0, cssH = 0;
function fitCanvas(){
  const r = sea.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cssW = r.width; cssH = r.height;
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(sea);
window.addEventListener('resize', fitCanvas);
fitCanvas();

// 流れの粒子（潮流方向へ一様に流れるだけの軽い表現）
const P_COUNT = 120;
const particles = [];
for (let i = 0; i < P_COUNT; i++) particles.push({ x: Math.random(), y: Math.random() });
function stepParticles(dt){
  const spdPx = state.curKt * 26;   // px/秒（潮流kt比例）
  const vx = Math.sin(rad(state.curDeg)) * spdPx;
  const vy = -Math.cos(rad(state.curDeg)) * spdPx;
  for (const p of particles){
    p.x += vx * dt / Math.max(cssW, 1);
    p.y += vy * dt / Math.max(cssH, 1);
    if (p.x < -0.02) p.x += 1.04; if (p.x > 1.02) p.x -= 1.04;
    if (p.y < -0.02) p.y += 1.04; if (p.y > 1.02) p.y -= 1.04;
    p.px = p.x * cssW; p.py = p.y * cssH;
    p.vx = vx; p.vy = vy;
  }
}

// 配置：予測した全移動量が画面中央に収まるよう開始位置を決める
function layout(){
  const c = compute();
  const minDim = Math.min(cssW, cssH);
  const scale = c.distKm > 0.001 ? (0.38 * minDim) / c.distKm : 40;   // px/km
  const eKm = c.distKm * Math.sin(rad(c.deg));   // 全移動量の東成分
  const nKm = c.distKm * Math.cos(rad(c.deg));   // 全移動量の北成分
  const sx = cssW / 2 - eKm * scale * 0.5;
  const sy = cssH / 2 + nKm * scale * 0.5;
  return { c, scale, eKm, nKm, sx, sy };
}
function boatPos(L){
  const frac = state.minutes ? state.elapsedMin / state.minutes : 0;
  const e = L.eKm * frac, n = L.nKm * frac;
  return { x: L.sx + e * L.scale, y: L.sy - n * L.scale, e, n };
}

function drawArrow(x0, y0, degTo, kt, color, width){
  const minDim = Math.min(cssW, cssH);
  const len = Math.min(kt * (100 / 3), 0.45 * minDim);
  if (len < 3) return;
  const dx = Math.sin(rad(degTo)), dy = -Math.cos(rad(degTo));
  const x1 = x0 + dx * len, y1 = y0 + dy * len;
  const ang = Math.atan2(y1 - y0, x1 - x0);
  const head = Math.min(10, Math.max(5, len * 0.4));
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - head * Math.cos(ang - 0.42), y1 - head * Math.sin(ang - 0.42));
  ctx.lineTo(x1 - head * Math.cos(ang + 0.42), y1 - head * Math.sin(ang + 0.42));
  ctx.closePath(); ctx.fill();
}

function drawCompass(){
  const cx = cssW - 40, cy = 42, r = 25;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(6,24,40,0.38)'; ctx.fill();
  ctx.strokeStyle = 'rgba(220,240,255,0.4)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.font = '700 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffb020'; ctx.fillText('N', cx, cy - r + 8);
  ctx.fillStyle = 'rgba(234,242,248,0.85)';
  ctx.fillText('E', cx + r - 8, cy);
  ctx.fillText('S', cx, cy + r - 8);
  ctx.fillText('W', cx - r + 8, cy);
  ctx.restore();
}

function draw(){
  if (!cssW || !cssH) return;
  ctx.clearRect(0, 0, cssW, cssH);
  const L = layout();
  const c = L.c;

  // 粒子
  ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(200,230,255,0.35)';
  for (const p of particles){
    if (p.px === undefined) continue;
    ctx.beginPath();
    ctx.moveTo(p.px - (p.vx || 0) * 0.28, p.py - (p.vy || 0) * 0.28);
    ctx.lineTo(p.px, p.py);
    ctx.stroke();
  }

  const hasFlow = c.spd >= 0.005 && c.distKm > 0.001;
  const endX = L.sx + L.eKm * L.scale, endY = L.sy - L.nKm * L.scale;

  // 予測経路（破線）
  if (hasFlow){
    ctx.save();
    ctx.setLineDash([6, 5]);
    ctx.strokeStyle = 'rgba(234,242,248,0.55)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(L.sx, L.sy); ctx.lineTo(endX, endY); ctx.stroke();
    ctx.restore();
  }

  // ベクトル矢印（開始位置から）
  drawArrow(L.sx, L.sy, state.curDeg, state.curKt, '#4dd8ff', 2.5);          // 潮流
  drawArrow(L.sx, L.sy, c.windDriftDeg, c.windDriftKt, '#a8c8ff', 2.5);      // 風圧流
  if (hasFlow) drawArrow(L.sx, L.sy, c.deg, c.spd, '#ffb020', 3.5);          // 合成（船の流れ）

  // 開始位置マーカー
  ctx.strokeStyle = '#eaf2f8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(L.sx, L.sy, 7, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#eaf2f8';
  ctx.beginPath(); ctx.arc(L.sx, L.sy, 2, 0, Math.PI * 2); ctx.fill();
  ctx.font = '600 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('開始位置', L.sx, L.sy - 11);

  // 予測終了位置マーカー
  if (hasFlow){
    ctx.strokeStyle = '#ffb020'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(endX, endY, 8, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(endX, endY, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffb020'; ctx.fill();
    ctx.font = '600 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(`${state.minutes}分後`, endX, endY + 11);
  }

  // 船の軌跡
  if (trail.length > 1){
    for (let i = 0; i < trail.length; i++){
      const t = trail[i];
      const a = 0.08 + 0.4 * (i / trail.length);
      ctx.fillStyle = `rgba(255,176,32,${a.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(L.sx + t.e * L.scale, L.sy - t.n * L.scale, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 船
  const bp = boatPos(L);
  ctx.font = '30px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('⛵', bp.x, bp.y);

  drawCompass();
}

// ---- アニメーションループ ----
let lastTs = null;
function frame(ts){
  if (lastTs === null) lastTs = ts;
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  stepParticles(dt);
  if (state.playing){
    state.elapsedMin += dt * (state.minutes / PLAY_SECONDS);
    if (state.elapsedMin >= state.minutes){
      state.elapsedMin = state.minutes;
      setPlaying(false);
    }
    const L = layout();
    const bp = boatPos(L);
    trail.push({ e: bp.e, n: bp.n });
    if (trail.length > TRAIL_MAX) trail.shift();
    updateElapsedLabel();
  }
  draw();
  requestAnimationFrame(frame);
}

// ---- 初期化 ----
updateReadouts();
updateResults();
requestAnimationFrame(frame);
</script>
</body>
</html>
