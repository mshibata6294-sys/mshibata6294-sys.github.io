<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メモパッド</title>
<style>
  :root{
    --bg:#ede6d6;
    --paper:#fffdf6;
    --text:#33302a;
    --sub:#8a8272;
    --accent:#d97b06;
    --danger:#c0392b;
    --border:rgba(51,48,42,.14);
    --line:rgba(120,110,85,.20);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display:flex; flex-direction:column;
    overflow:hidden;
    user-select:none; -webkit-user-select:none;
  }
  .hidden{display:none !important}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:var(--text)}
  .view{display:flex; flex-direction:column; flex:1; min-height:0}

  /* ---------- 一覧 ---------- */
  #listView header{
    padding:16px 16px 10px;
    display:flex; align-items:baseline; gap:10px;
  }
  #listView header h1{font-size:24px; font-weight:700; letter-spacing:.02em}
  #noteCount{font-size:13px; color:var(--sub)}
  #listMain{flex:1; overflow-y:auto; padding:4px 14px 96px}
  #emptyState{
    text-align:center; color:var(--sub); font-size:15px;
    padding:64px 20px; line-height:1.8;
  }
  #cards{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:14px;
  }
  .card{
    position:relative;
    background:var(--paper); border:1px solid var(--border); border-radius:8px;
    padding:8px; cursor:pointer; box-shadow:0 1px 3px rgba(51,48,42,.10);
  }
  .card:active{transform:scale(.98)}
  .card .thumbWrap{
    width:100%; aspect-ratio:3/4; border-radius:4px; overflow:hidden;
    background:var(--paper); border:1px solid rgba(51,48,42,.07);
    display:flex; align-items:center; justify-content:center;
  }
  .card img.thumb{width:100%; height:100%; object-fit:cover; display:block}
  .card .noThumb{color:var(--sub); font-size:12px}
  .card .meta{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:7px; font-size:12px; color:var(--sub);
  }
  .card .pinBtn{
    position:absolute; top:4px; right:4px; z-index:2;
    font-size:14px; line-height:1; padding:5px 7px; border-radius:999px;
    background:rgba(255,253,246,.88); border:1px solid var(--border);
  }
  .card .pinBtn.off{opacity:.35; filter:grayscale(1)}
  .card .pinBtn:active{transform:scale(.92)}
  #newBtn{
    position:fixed; left:16px; right:16px;
    bottom:calc(16px + env(safe-area-inset-bottom));
    background:var(--accent); color:#fff; font-size:17px; font-weight:700;
    padding:15px 0; border-radius:999px; box-shadow:0 4px 14px rgba(217,123,6,.40);
    z-index:10;
  }
  #newBtn:active{opacity:.85}

  /* ---------- 編集（全面の紙） ---------- */
  #editorView{
    position:relative;
    background-color:var(--paper);
    background-image:repeating-linear-gradient(to bottom,
      transparent 0, transparent 33px, var(--line) 33px, var(--line) 34px);
    background-position:0 12px;
  }
  #pad{
    position:absolute; inset:0;
    display:block; width:100%; height:100%;
    touch-action:none;
  }
  .topbar{
    position:absolute; top:0; left:0; right:0; z-index:5;
    display:flex; align-items:center; gap:6px;
    padding:calc(6px + env(safe-area-inset-top)) 10px 7px;
    background:rgba(255,253,246,.72);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
  }
  .topbar button{
    font-size:13px; padding:6px 10px; border-radius:999px;
    background:rgba(255,253,246,.85); border:1px solid var(--border);
    white-space:nowrap;
  }
  .topbar button:active{opacity:.7}
  #backBtn{font-weight:700}
  #saveStatus{flex:1; text-align:center; font-size:11.5px; color:var(--sub); min-width:0}
  #deleteBtn{color:var(--danger)}
</style>
</head>
<body>

  <!-- 一覧ビュー -->
  <div id="listView" class="view">
    <header>
      <h1>メモパッド</h1>
      <span id="noteCount"></span>
    </header>
    <main id="listMain">
      <div id="emptyState" class="hidden">メモはまだありません<br>下のボタンから書いてみましょう</div>
      <div id="cards"></div>
    </main>
    <button id="newBtn">＋ 新規メモ</button>
  </div>

  <!-- 編集ビュー（全面の紙＋万年筆） -->
  <div id="editorView" class="view hidden">
    <canvas id="pad"></canvas>
    <div class="topbar">
      <button id="backBtn">← 一覧</button>
      <span id="saveStatus"></span>
      <button id="undoBtn">⟲ もどす</button>
      <button id="clearBtn">全消し</button>
      <button id="deleteBtn">削除</button>
    </div>
  </div>

<script>
'use strict';
/* ================= データ ================= */
const KEY = 'memoPad.notes.v2';
const PAPER = '#fffdf6';
const LINE_COLOR = 'rgba(120,110,85,0.20)';
const INK = '#1d2c4e';        // 万年筆のブルーブラック
const INK_ALPHA = 0.92;
const BASE_W = 3.4;           // 画面幅360pxのときの基本の太さ（CSS px）

function loadNotes(){
  try{
    const raw = localStorage.getItem(KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return [];
    return arr.filter(n => n && typeof n === 'object' && Array.isArray(n.strokes));
  }catch(e){ return []; }
}
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(notes)); }catch(e){ /* 容量超過などは無視 */ }
}
let notes = loadNotes();

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function fmtDate(ts){
  const d = new Date(ts);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hh + ':' + mm;
}
function findNote(id){ return notes.find(n => n.id === id) || null; }

/* ================= 一覧 ================= */
const listView = document.getElementById('listView');
const editorView = document.getElementById('editorView');
const cardsEl = document.getElementById('cards');
const emptyEl = document.getElementById('emptyState');
const countEl = document.getElementById('noteCount');

function renderList(){
  const sorted = notes.slice().sort((a, b) =>
    (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updatedAt - a.updatedAt);
  countEl.textContent = notes.length ? notes.length + '件' : '';
  emptyEl.classList.toggle('hidden', notes.length > 0);
  cardsEl.textContent = '';
  for (const note of sorted){
    const card = document.createElement('div');
    card.className = 'card';
    const pinBtn = document.createElement('button');
    pinBtn.className = 'pinBtn' + (note.pinned ? '' : ' off');
    pinBtn.textContent = '📌';
    pinBtn.setAttribute('aria-label', 'ピン留め切替');
    pinBtn.addEventListener('click', ev => {
      ev.stopPropagation();
      note.pinned = !note.pinned;
      persist();
      renderList();
    });
    card.appendChild(pinBtn);
    const wrap = document.createElement('div');
    wrap.className = 'thumbWrap';
    if (note.thumb){
      const img = document.createElement('img');
      img.className = 'thumb';
      img.src = note.thumb;
      img.alt = 'メモのサムネイル';
      wrap.appendChild(img);
    } else {
      const span = document.createElement('span');
      span.className = 'noThumb';
      span.textContent = '（空白）';
      wrap.appendChild(span);
    }
    const meta = document.createElement('div');
    meta.className = 'meta';
    const date = document.createElement('span');
    date.textContent = fmtDate(note.updatedAt);
    meta.appendChild(date);
    card.appendChild(wrap);
    card.appendChild(meta);
    card.addEventListener('click', () => openEditor(note.id, false));
    cardsEl.appendChild(card);
  }
}

/* ================= 編集 ================= */
const canvas = document.getElementById('pad');
const ctx = canvas.getContext('2d');
const saveStatus = document.getElementById('saveStatus');

let currentId = null;
let currentIsNew = false;
let cssW = 0, cssH = 0;   // キャンバスのCSSピクセルサイズ
let dpr = 1;

function currentNote(){ return currentId ? findNote(currentId) : null; }

function openEditor(id, isNew){
  currentId = id;
  currentIsNew = isNew;
  saveStatus.textContent = '';
  listView.classList.add('hidden');
  editorView.classList.remove('hidden');
  requestAnimationFrame(() => { fitCanvas(); });
}
function backToList(){
  const note = currentNote();
  if (note && currentIsNew && note.strokes.length === 0){
    notes = notes.filter(n => n.id !== note.id);
    persist();
  }
  currentId = null;
  currentIsNew = false;
  editorView.classList.add('hidden');
  listView.classList.remove('hidden');
  renderList();
}

/* ---- キャンバスのフィット＆再描画 ---- */
function fitCanvas(){
  if (editorView.classList.contains('hidden')) return;
  const w = editorView.clientWidth, h = editorView.clientHeight;
  if (w <= 0 || h <= 0) return;
  cssW = w; cssH = h;
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const note = currentNote();
  if (note && !note.pageH) note.pageH = h / w;   // 作成時の画面アスペクトを記録
  redrawAll();
}
window.addEventListener('resize', fitCanvas);

/* ---- 万年筆ストローク描画 ----
   座標は「キャンバス幅＝1.0」で正規化（yも幅基準）。
   呼び出し側で setTransform(unit,0,0,unit,ox,oy) を設定しておくこと。
   線幅は正規化単位で BASE_W/360 × w倍率 × テーパー。 */
function taperPoint(i, n){
  const fromStart = i >= 3 ? 1 : 0.25 + 0.75 * (i / 3);
  const j = n - 1 - i;
  const fromEnd = j >= 3 ? 1 : 0.25 + 0.75 * (j / 3);
  return Math.min(fromStart, fromEnd);
}
function startTaper(i){
  return i >= 3 ? 1 : 0.25 + 0.75 * (i / 3);
}
function drawStroke(c, stroke){
  const pts = stroke.points;
  const n = pts.length;
  if (!n) return;
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.globalCompositeOperation = 'source-over';
  c.globalAlpha = INK_ALPHA;
  c.strokeStyle = INK;
  c.fillStyle = INK;
  if (n === 1){
    const r = (BASE_W * pts[0][2] / 360) / 2;
    c.beginPath();
    c.arc(pts[0][0], pts[0][1], Math.max(r, 0.0012), 0, Math.PI * 2);
    c.fill();
    return;
  }
  const mid = i => [ (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2 ];
  if (n === 2){
    c.lineWidth = BASE_W * ((pts[0][2] + pts[1][2]) / 2) * taperPoint(0, n) / 360;
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    c.lineTo(pts[1][0], pts[1][1]);
    c.stroke();
    return;
  }
  // 始端ピース：p0 → m0
  let m = mid(0);
  c.lineWidth = BASE_W * pts[0][2] * taperPoint(0, n) / 360;
  c.beginPath();
  c.moveTo(pts[0][0], pts[0][1]);
  c.lineTo(m[0], m[1]);
  c.stroke();
  // 中間ピース：m(i-1) から p(i) を制御点に m(i) へ
  for (let i = 1; i < n - 1; i++){
    const prevM = m, curM = mid(i);
    c.lineWidth = BASE_W * pts[i][2] * taperPoint(i, n) / 360;
    c.beginPath();
    c.moveTo(prevM[0], prevM[1]);
    c.quadraticCurveTo(pts[i][0], pts[i][1], curM[0], curM[1]);
    c.stroke();
    m = curM;
  }
  // 終端ピース：m(n-2) → p(n-1)
  c.lineWidth = BASE_W * pts[n - 1][2] * taperPoint(n - 1, n) / 360;
  c.beginPath();
  c.moveTo(m[0], m[1]);
  c.lineTo(pts[n - 1][0], pts[n - 1][1]);
  c.stroke();
}
function redrawAll(){
  const note = currentNote();
  if (!note || !cssW) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(canvas.width, 0, 0, canvas.width, 0, 0);
  for (const s of note.strokes) drawStroke(ctx, s);
  ctx.globalAlpha = 1;
}

/* ---- サムネイル生成（270×360、pageHに合わせてレターボックス） ---- */
function makeThumb(note){
  const TW = 270, TH = 360;
  const off = document.createElement('canvas');
  off.width = TW; off.height = TH;
  const c = off.getContext('2d');
  c.fillStyle = PAPER;
  c.fillRect(0, 0, TW, TH);
  c.strokeStyle = LINE_COLOR;
  c.lineWidth = 1;
  c.beginPath();
  for (let y = 30; y < TH; y += 30){ c.moveTo(0, y + 0.5); c.lineTo(TW, y + 0.5); }
  c.stroke();
  const pageH = note.pageH || 4 / 3;
  const fit = Math.min(1, (4 / 3) / pageH);
  const ox = (1 - fit) / 2;
  const oy = (4 / 3 - pageH * fit) / 2;
  c.setTransform(TW * fit, 0, 0, TW * fit, ox * TW, oy * TW);
  for (const s of note.strokes) drawStroke(c, s);
  c.globalAlpha = 1;
  c.setTransform(1, 0, 0, 1, 0, 0);
  try{ return off.toDataURL('image/jpeg', 0.85); }catch(e){ return ''; }
}

/* ---- 保存 ---- */
function saveCurrent(){
  const note = currentNote();
  if (!note) return;
  note.updatedAt = Date.now();
  note.thumb = makeThumb(note);
  persist();
  saveStatus.textContent = '保存しました';
}

/* ---- 手書き入力（速く動かすと細く、ゆっくりだと太くなる万年筆） ---- */
let drawing = false;
let curStroke = null;
let curW = 1;          // 平滑化中の太さ倍率
let lastPt = null;     // {x, y, t} 直前に記録した点
let lastMid = null;    // ライブ描画で最後に描いた中点

function toNorm(e){
  const r = canvas.getBoundingClientRect();
  return [ (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.width ];
}
function liveSetup(){
  ctx.setTransform(canvas.width, 0, 0, canvas.width, 0, 0);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = INK_ALPHA;
  ctx.strokeStyle = INK;
  ctx.fillStyle = INK;
}
function drawDot(x, y, w){
  liveSetup();
  const r = (BASE_W * w / 360) / 2;
  ctx.beginPath();
  ctx.arc(x, y, Math.max(r, 0.0012), 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}
canvas.addEventListener('pointerdown', e => {
  const note = currentNote();
  if (!note || drawing) return;
  if (e.button !== undefined && e.button > 0) return;
  e.preventDefault();
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){ /* noop */ }
  drawing = true;
  curW = 1;
  const p = toNorm(e);
  curStroke = { points: [[p[0], p[1], curW]] };
  lastPt = { x: p[0], y: p[1], t: e.timeStamp };
  lastMid = p;
  drawDot(p[0], p[1], curW);
});
function processMove(e){
  const p = toNorm(e);
  const dx = p[0] - lastPt.x, dy = p[1] - lastPt.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 0.003) return;
  let dt = (e.timeStamp - lastPt.t) / 1000;
  if (!(dt > 0)) dt = 0.016;
  const speed = dist / dt;   // 正規化単位/秒
  let target = Math.min(1.55, Math.max(0.4, 1.55 - speed * 1.1));
  if (e.pressure && e.pressure > 0) target *= (0.6 + 0.8 * e.pressure);
  curW += (target - curW) * 0.35;
  const pts = curStroke.points;
  pts.push([p[0], p[1], curW]);
  const i = pts.length - 1;
  const mid = [ (lastPt.x + p[0]) / 2, (lastPt.y + p[1]) / 2 ];
  liveSetup();
  if (i === 1){
    ctx.lineWidth = BASE_W * pts[0][2] * startTaper(0) / 360;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    ctx.lineTo(mid[0], mid[1]);
    ctx.stroke();
  } else {
    ctx.lineWidth = BASE_W * pts[i - 1][2] * startTaper(i - 1) / 360;
    ctx.beginPath();
    ctx.moveTo(lastMid[0], lastMid[1]);
    ctx.quadraticCurveTo(lastPt.x, lastPt.y, mid[0], mid[1]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  lastMid = mid;
  lastPt = { x: p[0], y: p[1], t: e.timeStamp };
}
canvas.addEventListener('pointermove', e => {
  if (!drawing || !curStroke) return;
  e.preventDefault();
  const evs = (typeof e.getCoalescedEvents === 'function') ? e.getCoalescedEvents() : null;
  if (evs && evs.length){ for (const ev of evs) processMove(ev); }
  else processMove(e);
});
function endStroke(){
  if (!drawing) return;
  drawing = false;
  const note = currentNote();
  if (note && curStroke && curStroke.points.length){
    note.strokes.push(curStroke);
    saveCurrent();
    redrawAll();   // 終端テーパーまで含めた再描画にそろえる
  }
  curStroke = null;
  lastPt = null;
  lastMid = null;
}
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---- 上部バー ---- */
document.getElementById('backBtn').addEventListener('click', backToList);
document.getElementById('undoBtn').addEventListener('click', () => {
  const note = currentNote();
  if (!note || !note.strokes.length) return;
  note.strokes.pop();
  redrawAll();
  saveCurrent();
});
document.getElementById('clearBtn').addEventListener('click', () => {
  const note = currentNote();
  if (!note || !note.strokes.length) return;
  if (!confirm('書いた内容を全て消しますか？')) return;
  note.strokes = [];
  redrawAll();
  saveCurrent();
});
document.getElementById('deleteBtn').addEventListener('click', () => {
  const note = currentNote();
  if (!note) return;
  if (!confirm('このメモを削除しますか？')) return;
  notes = notes.filter(n => n.id !== note.id);
  persist();
  currentIsNew = false;
  backToList();
});

/* ---- 新規作成 ---- */
document.getElementById('newBtn').addEventListener('click', () => {
  const now = Date.now();
  const note = { id: uid(), strokes: [], pageH: 0, pinned: false, createdAt: now, updatedAt: now, thumb: '' };
  notes.push(note);
  openEditor(note.id, true);
});

renderList();
</script>
</body>
</html>
