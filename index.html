<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メモ帳</title>
<style>
  :root{
    --bg:#0b1c2c;
    --panel:#12293d;
    --panel2:#0e2233;
    --text:#eaf2f8;
    --sub:#9db4c6;
    --accent:#ffb020;
    --danger:#ff6b6b;
    --border:rgba(157,180,198,.18);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .hidden{display:none !important}

  /* ---------- 共通 ---------- */
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:var(--text)}
  .view{display:flex; flex-direction:column; flex:1; min-height:0}

  /* ---------- 一覧 ---------- */
  #listView header{
    padding:16px 16px 10px;
    display:flex; align-items:baseline; gap:10px;
  }
  #listView header h1{font-size:24px; font-weight:700; letter-spacing:.02em}
  #noteCount{font-size:13px; color:var(--sub)}
  .searchWrap{padding:0 16px 10px}
  #searchInput{
    width:100%; padding:11px 14px; font-size:16px;
    background:var(--panel2); color:var(--text);
    border:1px solid var(--border); border-radius:12px; outline:none;
  }
  #searchInput::placeholder{color:var(--sub)}
  #searchInput:focus{border-color:var(--accent)}
  #noteList{
    flex:1; overflow-y:auto; padding:2px 16px 96px;
    display:flex; flex-direction:column; gap:10px;
  }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:13px 15px; text-align:left; width:100%;
    display:block;
  }
  .card:active{background:var(--panel2)}
  .cardTop{display:flex; align-items:flex-start; gap:8px}
  .cardTitle{
    flex:1; font-size:16px; font-weight:700; line-height:1.4;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .pinMark{font-size:13px; flex:0 0 auto}
  .cardPreview{
    margin-top:4px; font-size:13.5px; color:var(--sub); line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    word-break:break-all; white-space:pre-wrap;
  }
  .cardDate{margin-top:7px; font-size:11.5px; color:var(--sub); opacity:.75}
  .emptyMsg{
    text-align:center; color:var(--sub); font-size:14.5px;
    padding:48px 20px; line-height:1.7;
  }
  #newBtn{
    position:fixed; left:16px; right:16px;
    bottom:calc(16px + env(safe-area-inset-bottom));
    background:var(--accent); color:#231600;
    font-size:17px; font-weight:700;
    padding:15px 0; border-radius:14px;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
  }
  #newBtn:active{opacity:.85}

  /* ---------- 編集 ---------- */
  #editorView header{
    padding:12px 12px 8px;
    display:flex; align-items:center; gap:6px;
  }
  #backBtn{
    font-size:15.5px; color:var(--accent); font-weight:600;
    padding:8px 10px; border-radius:10px;
  }
  #backBtn:active{background:var(--panel2)}
  .editorSpacer{flex:1}
  #pinBtn{
    font-size:13.5px; padding:8px 12px; border-radius:999px;
    background:var(--panel); border:1px solid var(--border); color:var(--sub);
  }
  #pinBtn.on{color:var(--accent); border-color:var(--accent)}
  #deleteBtn{
    font-size:13.5px; padding:8px 12px; border-radius:999px;
    background:var(--panel); border:1px solid var(--border); color:var(--danger);
  }
  #memoText{
    flex:1; width:100%; resize:none; border:none; outline:none;
    background:var(--panel2); color:var(--text);
    font-family:inherit; font-size:16.5px; line-height:1.65;
    padding:16px; margin:0 12px; border-radius:14px;
    width:calc(100% - 24px);
  }
  #memoText::placeholder{color:var(--sub)}
  .editorFooter{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 20px 12px; font-size:12.5px; color:var(--sub);
    min-height:36px;
  }
  #saveStatus{transition:opacity .3s}
</style>
</head>
<body>

  <!-- ===== 一覧ビュー ===== -->
  <section id="listView" class="view">
    <header>
      <h1>メモ帳</h1>
      <span id="noteCount"></span>
    </header>
    <div class="searchWrap">
      <input id="searchInput" type="search" placeholder="メモを検索" autocomplete="off">
    </div>
    <div id="noteList"></div>
    <button id="newBtn" type="button">＋ 新規メモ</button>
  </section>

  <!-- ===== 編集ビュー ===== -->
  <section id="editorView" class="view hidden">
    <header>
      <button id="backBtn" type="button">← 一覧</button>
      <div class="editorSpacer"></div>
      <button id="pinBtn" type="button">📌 ピン留めする</button>
      <button id="deleteBtn" type="button">削除</button>
    </header>
    <textarea id="memoText" placeholder="メモを入力…"></textarea>
    <div class="editorFooter">
      <span id="saveStatus"></span>
      <span id="charCount">0文字</span>
    </div>
  </section>

<script>
'use strict';

// ---------- 保存 ----------
const STORAGE_KEY = 'memoApp.notes.v1';

function loadNotes(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(e){
    return [];
  }
}
function saveNotes(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  }catch(e){ /* 保存容量超過などは無視 */ }
}

let notes = loadNotes();
let currentId = null;      // 編集中のメモID
let isNewNote = false;     // 新規作成直後かどうか（空のまま戻ったら破棄）
let saveTimer = null;

// ---------- DOM ----------
const listView   = document.getElementById('listView');
const editorView = document.getElementById('editorView');
const noteList   = document.getElementById('noteList');
const noteCount  = document.getElementById('noteCount');
const searchInput= document.getElementById('searchInput');
const memoText   = document.getElementById('memoText');
const saveStatus = document.getElementById('saveStatus');
const charCount  = document.getElementById('charCount');
const pinBtn     = document.getElementById('pinBtn');

// ---------- ユーティリティ ----------
function newId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}
function fmtDate(ts){
  const d = new Date(ts);
  const mm = d.getMonth() + 1;
  const dd = d.getDate();
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return mm + '/' + dd + ' ' + hh + ':' + mi;
}
function getNote(id){
  return notes.find(n => n.id === id) || null;
}
function splitTitleBody(text){
  const lines = (text || '').split('\n');
  const title = (lines[0] || '').trim();
  const body = lines.slice(1).join('\n').trim();
  return { title: title || '(無題)', body };
}

// ---------- 一覧描画 ----------
function renderList(){
  const q = searchInput.value.trim().toLowerCase();
  noteCount.textContent = notes.length ? notes.length + '件' : '';

  const sorted = notes.slice().sort((a, b) => {
    if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
    return (b.updatedAt || 0) - (a.updatedAt || 0);
  });
  const filtered = q
    ? sorted.filter(n => (n.text || '').toLowerCase().includes(q))
    : sorted;

  noteList.textContent = '';

  if (!filtered.length){
    const div = document.createElement('div');
    div.className = 'emptyMsg';
    div.textContent = q ? '見つかりませんでした' : 'メモはまだありません';
    noteList.appendChild(div);
    return;
  }

  for (const n of filtered){
    const { title, body } = splitTitleBody(n.text);

    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';
    card.addEventListener('click', () => openEditor(n.id, false));

    const top = document.createElement('div');
    top.className = 'cardTop';

    const titleEl = document.createElement('div');
    titleEl.className = 'cardTitle';
    titleEl.textContent = title;
    top.appendChild(titleEl);

    if (n.pinned){
      const pin = document.createElement('span');
      pin.className = 'pinMark';
      pin.textContent = '📌';
      top.appendChild(pin);
    }
    card.appendChild(top);

    if (body){
      const prev = document.createElement('div');
      prev.className = 'cardPreview';
      prev.textContent = body;
      card.appendChild(prev);
    }

    const date = document.createElement('div');
    date.className = 'cardDate';
    date.textContent = fmtDate(n.updatedAt || n.createdAt || Date.now());
    card.appendChild(date);

    noteList.appendChild(card);
  }
}

// ---------- 編集 ----------
function openEditor(id, isNew){
  const note = getNote(id);
  if (!note) return;
  currentId = id;
  isNewNote = !!isNew;
  memoText.value = note.text || '';
  updatePinBtn();
  updateCharCount();
  saveStatus.textContent = '';
  listView.classList.add('hidden');
  editorView.classList.remove('hidden');
  if (isNew){
    // 新規メモはすぐ入力できるようフォーカス
    setTimeout(() => memoText.focus(), 50);
  }
}

function closeEditor(){
  if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  const note = getNote(currentId);
  if (note){
    // 空のままの新規メモは静かに破棄
    if (isNewNote && !(note.text || '').trim()){
      notes = notes.filter(n => n.id !== currentId);
      saveNotes();
    } else {
      // 戻る直前にも確実に保存
      note.text = memoText.value;
      saveNotes();
    }
  }
  currentId = null;
  isNewNote = false;
  editorView.classList.add('hidden');
  listView.classList.remove('hidden');
  renderList();
}

function updatePinBtn(){
  const note = getNote(currentId);
  const pinned = !!(note && note.pinned);
  pinBtn.textContent = pinned ? '📌 ピン留め中' : '📌 ピン留めする';
  pinBtn.classList.toggle('on', pinned);
}

function updateCharCount(){
  charCount.textContent = memoText.value.length + '文字';
}

function scheduleSave(){
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    saveTimer = null;
    const note = getNote(currentId);
    if (!note) return;
    if (note.text !== memoText.value){
      note.text = memoText.value;
      note.updatedAt = Date.now();
    }
    saveNotes();
    saveStatus.textContent = '保存しました';
  }, 300);
}

// ---------- イベント ----------
document.getElementById('newBtn').addEventListener('click', () => {
  const now = Date.now();
  const note = { id: newId(), text: '', pinned: false, createdAt: now, updatedAt: now };
  notes.push(note);
  saveNotes();
  openEditor(note.id, true);
});

searchInput.addEventListener('input', renderList);

memoText.addEventListener('input', () => {
  saveStatus.textContent = '';
  updateCharCount();
  scheduleSave();
});

pinBtn.addEventListener('click', () => {
  const note = getNote(currentId);
  if (!note) return;
  note.pinned = !note.pinned;
  note.updatedAt = Date.now();
  saveNotes();
  updatePinBtn();
});

document.getElementById('deleteBtn').addEventListener('click', () => {
  if (!currentId) return;
  if (!confirm('このメモを削除しますか？')) return;
  if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  notes = notes.filter(n => n.id !== currentId);
  saveNotes();
  currentId = null;
  isNewNote = false;
  editorView.classList.add('hidden');
  listView.classList.remove('hidden');
  renderList();
});

document.getElementById('backBtn').addEventListener('click', closeEditor);

// ---------- 初期表示 ----------
renderList();
</script>
</body>
</html>
